[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "website-health-manager"
version = "0.1.4"
description = "Desktop app to monitor websites, domains, SSL, DNS, and email authentication"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pieter" }]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "cryptography>=42",
    "python-whois>=0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
whm = "whm.main:main"
whm-migrate-cloud = "whm.migrate_to_cloud:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whm = ["presentation/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
